<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可达鸭预设检索站</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <!-- 桌面端为固定侧栏；800px 以下由 script.js 切换为可开关的筛选抽屉。 -->
        <aside class="sidebar" id="filterSidebar" aria-label="预设筛选">
            <div class="sidebar-header">
                <div class="brand">
                    <i class="fas fa-duck fa-lg" aria-hidden="true"></i> 可达鸭预设检索站
                </div>
                <button class="icon-button sidebar-close" id="closeFilters" type="button" aria-label="关闭筛选">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
            </div>

            <div class="filter-section">
                <div class="filter-group">
                    <label for="searchInput"><i class="fas fa-search" aria-hidden="true"></i> 关键词搜索</label>
                    <input type="text" id="searchInput" placeholder="搜索名称、作者...">
                </div>

                <div class="filter-group">
                    <label for="dungeonSearchInput"><i class="fas fa-dungeon" aria-hidden="true"></i> 副本/地图筛选</label>
                    <input type="text" id="dungeonSearchInput" placeholder="输入地图名称筛选..." style="margin-bottom: 8px;">
                    <select id="dungeonFilter">
                        <option value="ALL">全部地图</option>
                        </select>
                </div>

                <div class="filter-group">
                    <label for="authorFilter"><i class="fas fa-user-circle" aria-hidden="true"></i> 作者筛选</label>
                    <select id="authorFilter">
                        <option value="ALL">全部作者</option>
                        </select>
                </div>
            </div>

            <div class="stats-panel">
                <div class="stat-item">
                    <span class="stat-label">已加载预设</span>
                    <span class="stat-value" id="totalCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">当前显示</span>
                    <span class="stat-value highlight" id="displayCount" aria-live="polite">0</span>
                </div>
            </div>
            
            <div class="footer-info">
                数据来源: Github/Worker<br>
                Powered by Cloudflare
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="top-bar-title">
                    <!-- 仅在移动端显示，并通过 aria-expanded 同步抽屉状态。 -->
                    <button class="filter-toggle" id="openFilters" type="button" aria-controls="filterSidebar" aria-expanded="false">
                        <i class="fas fa-sliders-h" aria-hidden="true"></i>
                        <span>筛选</span>
                    </button>
                    <h2>预设列表</h2>
                </div>
                <div class="status-indicator" id="networkStatus" role="status" aria-live="polite">
                    <i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i> 正在连接中转API...
                </div>
            </header>

            <div id="gridContainer" class="grid-container">
                </div>
        </main>
    </div>
    <!-- 移动端抽屉遮罩：既阻止误触主内容，也提供点击关闭入口。 -->
    <button class="sidebar-backdrop" id="filterBackdrop" type="button" aria-label="关闭筛选" tabindex="-1"></button>

    <script src="script.js"></script>
</body>
</html>
